<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OVERDRIVE 1000 — Demo</title><style>html,body{margin:0;background:radial-gradient(ellipse at 50% 20%,#202254 0%,#080b1a 70%);color:#fff;font-family:system-ui,Arial;overflow:hidden}#game{width:100vw;height:100dvh}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#080b1a;color:#a9eaff;z-index:5}#loading.hidden{display:none}</style></head><body><div id="loading">Завантаження Phaser…</div><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="engine.js?v=091"></script><script>
(()=>{'use strict';const W=420,H=760,COLS=6,ROWS=5,syms=['CAT1','CAT2','CAT3','CAT4','CAT5','SCATTER'],colors=[0x49dfff,0xa775ff,0xffd15b,0xff678c,0xf4c968,0xffe18a];let scene,grid=[],balance=1000,bet=1,busy=false,free=0,bonusMult=1,win=0,bonusBetCents=null,bonusLocked=false,bonusWinCents=0,bonusPaidCents=0,turbo=false,autoRemaining=0,autoRunning=false,autoStop=false;let balanceText,betText,winText,modeText,levelText,statusText,spinBtn,minusBtn,plusBtn,turboBtn,autoBtn,bonusWinText,tiles=[];function catSvg(id){const neon=['#ff315c','#55fa76','#ffbe38','#4aaaff','#bb62ff','#ff9c24'][id],fur=['#c9b8d3','#353342','#efb875','#66728e','#aaa0c4','#c77b4a'][id];const accessories=[`<path d="M18 75 L34 60 L47 72 L60 60 L78 75" fill="none" stroke="#f3f3f9" stroke-width="5"/>`,`<path d="M22 24 L26 12 L69 12 L78 26Z" fill="#151923" stroke="#60ff83" stroke-width="2"/><path d="M23 31 L76 31" stroke="#6cff8d" stroke-width="5"/>`,`<rect x="19" y="39" width="62" height="18" rx="8" fill="#0c0c16" stroke="#ffd26a" stroke-width="2"/><path d="M45 39 L54 57" stroke="#ffdf7d" stroke-width="3"/>`,`<circle cx="78" cy="50" r="16" fill="#11172c" stroke="#53caff" stroke-width="5"/><path d="M78 50 L92 50" stroke="#54d9ff" stroke-width="3"/>`,`<path d="M15 27 Q50 -2 85 27 L79 37 L20 37Z" fill="#201b37" stroke="#bd77ff" stroke-width="3"/><circle cx="53" cy="18" r="6" fill="#d59bff"/>`,`<path d="M17 27 L29 9 L43 23 L51 5 L62 24 L78 8 L86 30Z" fill="#ffc544" stroke="#fff0a1" stroke-width="3"/><circle cx="51" cy="16" r="5" fill="#ff365b"/>`][id];return '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 100 100"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#29355c"/><stop offset="1" stop-color="#080b1c"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="11" fill="url(#g)" stroke="'+neon+'" stroke-width="3"/><path d="M14 40 L18 9 L39 29 Q50 23 61 29 L82 9 L86 40 Q93 62 77 81 Q50 98 23 81 Q7 62 14 40Z" fill="'+fur+'" stroke="#121020" stroke-width="4"/><path d="M19 16 L34 32 L20 35Z M81 16 L66 32 L80 35Z" fill="#ff789f"/><path d="M21 48 Q33 40 45 50 L39 56 L27 55Z M55 50 Q67 40 79 48 L73 55 L61 56Z" fill="'+neon+'"/><path d="M34 47 L36 55 M64 47 L66 55" stroke="#0a1022" stroke-width="4"/><path d="M45 66 L55 66 L50 72Z" fill="#e9a6b7"/><path d="M50 72 Q43 78 37 74 M50 72 Q57 78 63 74" fill="none" stroke="#17121f" stroke-width="2"/><path d="M11 65 L37 68 M11 75 L36 72 M64 68 L89 65 M64 72 L89 75" stroke="#e5e1ff" stroke-width="1.5"/>'+accessories+(id===5?'<text x="50" y="94" font-size="15" font-weight="900" fill="#ffda65" stroke="#a53908" stroke-width="1" text-anchor="middle">SCATTER</text>':'')+'</svg>'}const catTextures=[];function prepareCats(scene){for(let i=0;i<6;i++){const key='cat-'+i;if(!scene.textures.exists(key)){const uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(catSvg(i));scene.textures.addBase64(key,uri)}catTextures[i]=key}}function symbolImage(x,y,id){return scene.add.image(x,y,catTextures[id]).setDisplaySize(56,55)}function setSymbol(a,id){a.t.setScale(1).setTexture(catTextures[id]).setDisplaySize(56,55)}const sleep=t=>new Promise(r=>setTimeout(r,t*(turbo?.28:1)));async function banner(title,subtitle,ms=1550){const bg=scene.add.rectangle(210,369,420,760,0x080b1a,.91).setDepth(30);const a=scene.add.text(210,332,title,{fontFamily:'system-ui,Arial',fontSize:35,color:'#ffdf74',fontStyle:'bold',align:'center',wordWrap:{width:390}}).setOrigin(.5).setDepth(31);const b=scene.add.text(210,410,subtitle,{fontFamily:'system-ui,Arial',fontSize:20,color:'#8eeaff',align:'center',wordWrap:{width:385}}).setOrigin(.5).setDepth(31);await sleep(ms);bg.destroy();a.destroy();b.destroy()}function text(x,y,s,size,color='#ffffff'){return scene.add.text(x,y,s,{fontFamily:'system-ui,Arial',fontSize:size,color,fontStyle:'bold'}).setOrigin(.5)}function pill(x,y,w,h,label,cb,color=0x26345b){let bg=scene.add.rectangle(x,y,w,h,color).setStrokeStyle(2,0x72dafa,.7).setInteractive({useHandCursor:true});let t=text(x,y,label,21);bg.on('pointerdown',cb);return {bg,t}}function refresh(){balanceText.setText(balance.toFixed(2));betText.setText(bet.toFixed(2));winText.setText(win.toFixed(2));modeText.setText(free?'FREE SPINS: '+free:'DEMO MODE');levelText.setText('×'+bonusMult);if(bonusWinText)bonusWinText.setText(bonusLocked?'BONUS WIN: '+(bonusWinCents/100).toFixed(2):'');spinBtn.t.setText(busy?'SPINNING…':free?'FREE SPIN':'SPIN');spinBtn.bg.setFillStyle(busy?0x293149:0x106a7a);if(autoBtn){autoBtn.t.setText(autoRunning?'■ STOP '+autoRemaining:'AUTO');autoBtn.bg.setFillStyle(autoRunning?0x884057:0x26345b)}if(turboBtn){turboBtn.t.setText(turbo?'⚡ TURBO ON':'⚡ TURBO');turboBtn.bg.setFillStyle(turbo?0x137a67:0x26345b)}for(const control of [minusBtn,plusBtn])if(control){control.bg.setFillStyle(busy||bonusLocked?0x1a2134:0x26345b);control.t.setAlpha(busy||bonusLocked?.35:1)}}function drawGrid(highlight=[]){let h=new Set(highlight.map(([x,y])=>y*COLS+x));for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let a=tiles[y][x],id=grid[y][x],c=colors[id];a.bg.setFillStyle(h.has(y*COLS+x)?0x394b75:0x111a34).setStrokeStyle(h.has(y*COLS+x)?3:1,h.has(y*COLS+x)?0xfff3a0:c,h.has(y*COLS+x)?1:.65);setSymbol(a,id);a.t.setScale(h.has(y*COLS+x)?1.06:1)}}function tween(targets,props){return new Promise(resolve=>scene.tweens.add({targets,...props,duration:Math.max(35,(props.duration||300)*(turbo?.3:1)),onComplete:resolve}))}
async function animateReels(next){const tasks=[];for(let x=0;x<COLS;x++){tasks.push((async()=>{await sleep(x*85);for(let y=0;y<ROWS;y++){const a=tiles[y][x],base=237+y*65;scene.tweens.killTweensOf([a.bg,a.t]);a.bg.y=base-52;a.t.y=base-52;a.bg.setAlpha(.18);a.t.setAlpha(.18);setSymbol(a,next[y][x]);a.bg.setStrokeStyle(2,colors[next[y][x]],.8);await tween([a.bg,a.t],{y:base,alpha:1,duration:350+y*36,ease:'Cubic.easeOut'});}})())}await Promise.all(tasks);grid=next;drawGrid()}
async function animateCascade(step){
const removed=new Set(step.clusters.flatMap(c=>c.cells.map(([x,y])=>y*COLS+x)));
const vanishing=[];
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(removed.has(y*COLS+x)){
const a=tiles[y][x];vanishing.push(tween([a.bg,a.t],{alpha:0,scaleX:.35,scaleY:.35,duration:230,ease:'Quad.easeIn'}))
}
await Promise.all(vanishing);
const ghosts=[],moves=[];
for(let x=0;x<COLS;x++){
const survivors=[];
for(let y=ROWS-1;y>=0;y--)if(!removed.has(y*COLS+x))survivors.push({id:step.grid[y][x],sourceY:y});
const missing=ROWS-survivors.length;
if(!missing)continue;
for(let y=0;y<ROWS;y++){tiles[y][x].bg.setAlpha(0);tiles[y][x].t.setAlpha(0)}
const destinations=[];
for(let i=0;i<survivors.length;i++)destinations.push({id:survivors[i].id,from:survivors[i].sourceY,to:ROWS-1-i});
for(let y=0;y<missing;y++)destinations.push({id:step.nextGrid[y][x],from:y-missing,to:y});
for(const item of destinations){
const xx=43+x*67,start=237+item.from*65,end=237+item.to*65,c=colors[item.id];
const bg=scene.add.rectangle(xx,start,61,59,0x192440).setStrokeStyle(2,c,.8);
const t=symbolImage(xx,start,item.id);
ghosts.push(bg,t);
moves.push((async()=>{await sleep(x*32+Math.max(0,item.to-item.from)*18);await tween([bg,t],{y:end,duration:310+Math.max(0,item.to-item.from)*32,ease:'Cubic.easeOut'})})());
}
}
await Promise.all(moves);
for(const obj of ghosts)obj.destroy();
grid=step.nextGrid;
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
const a=tiles[y][x],base=237+y*65;
a.bg.setPosition(43+x*67,base).setAlpha(1).setScale(1);
a.t.setPosition(43+x*67,base).setAlpha(1).setScale(1).setDisplaySize(56,55)
}

}
async function spin(){if(busy)return false;if(!free&&balance<bet){statusText.setText('Недостатньо DEMO кредитів');return false;}busy=true;win=0;const wasFree=free>0,cents=wasFree?bonusBetCents:Math.round(bet*100);if(!Number.isSafeInteger(cents)||cents<1)throw Error('Invalid bonus bet');if(!wasFree)balance=Math.round(balance*100-cents)/100;statusText.setText('ЗАПУСК…');refresh();await sleep(180);const result=OverdriveMath.spin({betCents:cents,freeSpins:free,stickyMultiplier:bonusMult,bonusPaidCents});free=result.freeSpins;bonusMult=result.stickyMultiplier;bonusPaidCents=result.bonusPaidCents;if(!wasFree&&free>0){bonusWinCents=0;bonusPaidCents=0}if(!wasFree&&free>0){bonusBetCents=cents;bonusLocked=true}if(free===0&&!wasFree){bonusBetCents=null;bonusLocked=false}await animateReels(result.initialGrid);if(!wasFree&&free>0)await banner('FREE SPINS','⚡ '+result.awardedFreeSpins+' ОБЕРТАНЬ');else if(wasFree&&result.awardedFreeSpins>0)await banner('RETRIGGER','+'+result.awardedFreeSpins+' FREE SPINS',1100);await sleep(350);for(let i=0;i<result.steps.length;i++){const step=result.steps[i];grid=step.grid;drawGrid(step.clusters.flatMap(c=>c.cells));let amount=step.winCents/100;win=Math.round((win+amount)*100)/100;balance=Math.round((balance+amount)*100)/100;if(wasFree)bonusWinCents+=step.winCents;statusText.setText('КАСКАД '+(i+1)+'   ×'+step.multiplier+(step.overdrive>1?' ⚡×'+step.overdrive:'')+'   +'+amount.toFixed(2));refresh();await sleep(260);await animateCascade(step);await sleep(130)}grid=result.finalGrid;drawGrid();if(result.awardedFreeSpins)statusText.setText('⚡ '+result.awardedFreeSpins+' FREE SPINS!');else if(wasFree&&free===0)statusText.setText('БОНУС ЗАВЕРШЕНО');else statusText.setText(win>0?'ВИГРАШ +'+win.toFixed(2):'СПРОБУЙ ЩЕ');if(result.capHit)statusText.setText('ЛІМІТ ВИПЛАТИ / КАСКАДІВ');if(wasFree&&free===0){await banner('BONUS COMPLETE','ЗАГАЛЬНИЙ ВИГРАШ: '+(bonusWinCents/100).toFixed(2),2100);bonusWinCents=0;bonusPaidCents=0}if(free===0){bonusBetCents=null;bonusLocked=false}busy=false;refresh();return true}
async function startAutoplay(count){if(autoRunning||busy)return;autoRunning=true;autoStop=false;autoRemaining=count;refresh();try{while(autoRemaining>0&&!autoStop){if(!free&&balance<bet)break;const ok=await spin();if(!ok)break;if(!free)autoRemaining--;refresh();if(autoRemaining>0&&!autoStop)await sleep(260)}}finally{autoRunning=false;autoStop=false;autoRemaining=0;refresh()}}
function autoControl(){if(autoRunning){autoStop=true;autoBtn.t.setText('STOPPING');return}if(busy)return;const bg=scene.add.rectangle(210,370,420,760,0x080b1a,.93).setDepth(40);const heading=scene.add.text(210,265,'AUTOPLAY',{fontFamily:'system-ui',fontSize:32,color:'#8eeaff',fontStyle:'bold'}).setOrigin(.5).setDepth(41);const objects=[bg,heading];const close=()=>objects.forEach(o=>o.destroy());for(let i=0;i<4;i++){const n=[10,25,50,100][i],x=125+(i%2)*170,y=350+Math.floor(i/2)*82;const b=scene.add.rectangle(x,y,145,62,0x26345b).setStrokeStyle(2,0x72dafa).setDepth(41).setInteractive();const t=scene.add.text(x,y,String(n)+' SPINS',{fontFamily:'system-ui',fontSize:18,color:'#ffffff',fontStyle:'bold'}).setOrigin(.5).setDepth(42);objects.push(b,t);b.on('pointerdown',()=>{close();startAutoplay(n)})}const cancel=scene.add.text(210,545,'CANCEL ✕',{fontFamily:'system-ui',fontSize:19,color:'#ff9bb1'}).setOrigin(.5).setDepth(42).setInteractive();objects.push(cancel);cancel.on('pointerdown',close)}
class Main extends Phaser.Scene{constructor(){super('Main')}create(){scene=this;prepareCats(this);this.cameras.main.setBackgroundColor('#070a19');let g=this.add.graphics();g.fillGradientStyle(0x24244f,0x161f44,0x080c1c,0x090a1b,1);g.fillRect(0,0,W,H);g.lineStyle(1,0x5d74b5,.12);for(let i=-W;i<W*2;i+=32){g.lineBetween(i,0,i+W,H)}for(let i=0;i<20;i++){let x=(i*127+39)%W,y=(i*193+71)%H;g.fillStyle(i%3?0x5ecaff:0xe59cff,.17);g.fillCircle(x,y,1+i%2)}g.fillStyle(0x090f2c,.7);g.fillRoundedRect(8,94,404,80,15);g.lineStyle(2,0x5c79cb,.55);g.strokeRoundedRect(8,94,404,80,15);g.fillStyle(0x0c1331,.9);g.fillRoundedRect(7,208,406,327,13);g.lineStyle(3,0x6b5cc6,.7);g.strokeRoundedRect(7,208,406,327,13);text(W/2,45,'⚡ OVERDRIVE',33,'#9deeff');text(W/2,83,'1 0 0 0   🐾   v0.9.1',15,'#e28cff');this.add.rectangle(210,128,390,64,0x172343).setStrokeStyle(1,0x41598d);text(84,111,'BALANCE',12,'#a7b8db');balanceText=text(84,139,'1000.00',23);text(323,111,'WIN',12,'#a7b8db');winText=text(323,139,'0.00',23,'#6df5b7');modeText=text(210,184,'DEMO MODE',15,'#caa4ff');bonusWinText=text(210,205,'',13,'#ffdf74');this.add.rectangle(210,369,398,320,0x0b1230,.35).setStrokeStyle(2,0x5f78cb,.55);for(let y=0;y<ROWS;y++){tiles[y]=[];for(let x=0;x<COLS;x++){let xx=43+x*67,yy=237+y*65;let bg=this.add.rectangle(xx,yy,61,59,0x111a34).setStrokeStyle(1,0x4b668c);let t=symbolImage(xx,yy,0);tiles[y][x]={bg,t}}}grid=OverdriveMath.newGrid();drawGrid();text(113,558,'⚡ OVERDRIVE MULTIPLIER',12,'#b4c8ff');levelText=text(334,559,'×1',27,'#ffdf74');statusText=text(210,602,'ГОТОВИЙ ДО ГРИ',16,'#a8e6ff');text(210,646,'BET',13,'#a7b8db');minusBtn=pill(81,681,58,55,'−',()=>{if(!busy&&!autoRunning&&!bonusLocked&&free===0){bet=Math.max(.2,+(bet/2).toFixed(2));refresh()}});betText=text(160,681,'1.00',23);plusBtn=pill(238,681,58,55,'+',()=>{if(!busy&&!autoRunning&&!bonusLocked&&free===0){bet=Math.min(100,+(bet*2).toFixed(2));refresh()}});autoBtn=pill(73,629,118,32,'AUTO',autoControl);autoBtn.t.setFontSize(15);turboBtn=pill(346,629,120,32,'⚡ TURBO',()=>{turbo=!turbo;refresh()},0x26345b);turboBtn.t.setFontSize(14);spinBtn=pill(346,681,120,65,'SPIN',spin,0x106a7a);text(210,737,'✦ DEMO ONLY • NO REAL MONEY ✦',11,'#839bd0');refresh()}}new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{pixelArt:false,antialias:true},scene:[Main]});document.getElementById('loading').classList.add('hidden')})();
