<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OVERDRIVE 1000 — Demo</title><style>html,body{margin:0;background:#080b1a;color:#fff;font-family:system-ui,Arial;overflow:hidden}#game{width:100vw;height:100dvh}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#080b1a;color:#a9eaff;z-index:5}#loading.hidden{display:none}</style></head><body><div id="loading">Завантаження Phaser…</div><div id="game"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="engine.js?v=032"></script><script>
(()=>{'use strict';const W=420,H=760,COLS=6,ROWS=5,syms=['◆','⬢','✦','●','▲','★'],colors=[0xff5478,0xffbc52,0x51d9ff,0x7bf2a2,0xbb82ff,0xffed8c];let scene,grid=[],balance=1000,bet=1,busy=false,free=0,bonusMult=1,win=0,bonusBetCents=null,bonusLocked=false;let balanceText,betText,winText,modeText,levelText,statusText,spinBtn,minusBtn,plusBtn,tiles=[];const sleep=t=>new Promise(r=>setTimeout(r,t));function text(x,y,s,size,color='#ffffff'){return scene.add.text(x,y,s,{fontFamily:'system-ui,Arial',fontSize:size,color,fontStyle:'bold'}).setOrigin(.5)}function pill(x,y,w,h,label,cb,color=0x26345b){let bg=scene.add.rectangle(x,y,w,h,color).setStrokeStyle(2,0x72dafa,.7).setInteractive({useHandCursor:true});let t=text(x,y,label,21);bg.on('pointerdown',cb);return {bg,t}}function refresh(){balanceText.setText(balance.toFixed(2));betText.setText(bet.toFixed(2));winText.setText(win.toFixed(2));modeText.setText(free?'FREE SPINS: '+free:'DEMO MODE');levelText.setText('×'+bonusMult);spinBtn.t.setText(busy?'SPINNING…':free?'FREE SPIN':'SPIN');spinBtn.bg.setFillStyle(busy?0x293149:0x106a7a);for(const control of [minusBtn,plusBtn])if(control){control.bg.setFillStyle(busy||bonusLocked?0x1a2134:0x26345b);control.t.setAlpha(busy||bonusLocked?.35:1)}}function drawGrid(highlight=[]){let h=new Set(highlight.map(([x,y])=>y*COLS+x));for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let a=tiles[y][x],id=grid[y][x],c=colors[id];a.bg.setFillStyle(h.has(y*COLS+x)?0xffffff:0x192440).setStrokeStyle(2,h.has(y*COLS+x)?0xffffff:c,h.has(y*COLS+x)?1:.8);a.t.setText(syms[id]).setColor('#'+c.toString(16).padStart(6,'0'));a.t.setScale(h.has(y*COLS+x)?1.3:1)}}async function spin(){if(busy)return;if(!free&&balance<bet){statusText.setText('Недостатньо DEMO кредитів');return;}busy=true;win=0;const wasFree=free>0,cents=wasFree?bonusBetCents:Math.round(bet*100);if(!Number.isSafeInteger(cents)||cents<1)throw Error('Invalid bonus bet');if(!wasFree)balance=Math.round(balance*100-cents)/100;statusText.setText('ЗАПУСК…');refresh();await sleep(180);const result=OverdriveMath.spin({betCents:cents,freeSpins:free,stickyMultiplier:bonusMult});free=result.freeSpins;bonusMult=result.stickyMultiplier;if(!wasFree&&free>0){bonusBetCents=cents;bonusLocked=true}if(free===0&&!wasFree){bonusBetCents=null;bonusLocked=false}grid=result.initialGrid;drawGrid();await sleep(350);for(let i=0;i<result.steps.length;i++){const step=result.steps[i];grid=step.grid;drawGrid(step.clusters.flatMap(c=>c.cells));let amount=step.winCents/100;win=Math.round((win+amount)*100)/100;balance=Math.round((balance+amount)*100)/100;statusText.setText('КАСКАД '+(i+1)+'   ×'+step.multiplier+(step.overdrive>1?' ⚡×'+step.overdrive:'')+'   +'+amount.toFixed(2));refresh();await sleep(470);grid=step.nextGrid;drawGrid();await sleep(300)}grid=result.finalGrid;drawGrid();if(result.awardedFreeSpins)statusText.setText('⚡ '+result.awardedFreeSpins+' FREE SPINS!');else if(wasFree&&free===0)statusText.setText('БОНУС ЗАВЕРШЕНО');else statusText.setText(win>0?'ВИГРАШ +'+win.toFixed(2):'СПРОБУЙ ЩЕ');if(result.capHit)statusText.setText('ЛІМІТ ВИПЛАТИ / КАСКАДІВ');if(free===0){bonusBetCents=null;bonusLocked=false}busy=false;refresh()}
class Main extends Phaser.Scene{constructor(){super('Main')}create(){scene=this;this.cameras.main.setBackgroundColor('#090d20');let g=this.add.graphics();g.fillGradientStyle(0x172146,0x172146,0x090d20,0x090d20,1);g.fillRect(0,0,W,H);text(W/2,47,'OVERDRIVE',37,'#8eeaff');text(W/2,83,'1 0 0 0   ⚡   v0.3.2',15,'#e28cff');this.add.rectangle(210,128,390,64,0x172343).setStrokeStyle(1,0x41598d);text(84,111,'BALANCE',12,'#a7b8db');balanceText=text(84,139,'1000.00',23);text(323,111,'WIN',12,'#a7b8db');winText=text(323,139,'0.00',23,'#6df5b7');modeText=text(210,189,'DEMO MODE',15,'#caa4ff');this.add.rectangle(210,369,402,325,0x111a33).setStrokeStyle(3,0x507db5);for(let y=0;y<ROWS;y++){tiles[y]=[];for(let x=0;x<COLS;x++){let xx=43+x*67,yy=237+y*65;let bg=this.add.rectangle(xx,yy,61,59,0x192440).setStrokeStyle(2,0x4b668c);let t=text(xx,yy,syms[0],37);tiles[y][x]={bg,t}}}grid=OverdriveMath.newGrid();drawGrid();text(100,558,'OVERDRIVE MULTIPLIER',13,'#a7b8db');levelText=text(334,559,'×1',27,'#ffdf74');statusText=text(210,602,'ГОТОВИЙ ДО ГРИ',16,'#a8e6ff');text(210,646,'BET',13,'#a7b8db');minusBtn=pill(81,681,58,55,'−',()=>{if(!busy&&!bonusLocked&&free===0){bet=Math.max(.2,+(bet/2).toFixed(2));refresh()}});betText=text(160,681,'1.00',23);plusBtn=pill(238,681,58,55,'+',()=>{if(!busy&&!bonusLocked&&free===0){bet=Math.min(100,+(bet*2).toFixed(2));refresh()}});spinBtn=pill(346,681,120,65,'SPIN',spin,0x106a7a);text(210,737,'Лише симуляція • без реальних грошей',11,'#7185ad');refresh()}}new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{pixelArt:false,antialias:true},scene:[Main]});document.getElementById('loading').classList.add('hidden')})();
</script></body></html>
